<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumina — Connexion (Spotify Style)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #121212;
    color: #FFFFFF;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .login-card {
    max-width: 420px;
    width: 100%;
    padding: 48px 40px;
  }

  /* Logo — cercle orange plein, comme le logo Spotify circulaire */
  .logo {
    text-align: center;
    margin-bottom: 40px;
  }
  .logo-circle {
    width: 64px;
    height: 64px;
    background: #FF6B00;
    border-radius: 50%;
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 28px;
    color: #000;
    cursor: pointer;
    transition: transform 150ms;
  }
  .logo-circle:hover { transform: scale(1.05); }

  .logo h1 {
    font-size: 28px;
    font-weight: 800;
    color: #FFF;
    letter-spacing: -0.5px;
  }
  .logo p {
    font-size: 14px;
    color: #808080;
    margin-top: 6px;
  }

  /* Formulaire — inputs sombres arrondis, like Spotify login */
  .form-group {
    margin-bottom: 16px;
  }
  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #B3B3B3;
    margin-bottom: 8px;
  }
  .form-group input {
    width: 100%;
    padding: 14px 18px;
    background: #181818;
    border: 1px solid #282828;
    border-radius: 100px;
    font-size: 14px;
    font-family: inherit;
    color: #FFF;
    outline: none;
    transition: all 200ms;
  }
  .form-group input:focus {
    border-color: #FF6B00;
    box-shadow: 0 0 0 2px rgba(255,107,0,0.15);
  }
  .form-group input::placeholder {
    color: #808080;
  }

  /* Bouton PRIMARY — orange rond, comme "Sign Up" Spotify */
  .btn-primary {
    width: 100%;
    padding: 16px;
    background: #FF6B00;
    color: #000;
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    border: none;
    border-radius: 100px;
    cursor: pointer;
    transition: all 150ms;
    margin-top: 8px;
    letter-spacing: 0.2px;
  }
  .btn-primary:hover {
    background: #FF8533;
    transform: scale(1.02);
  }
  .btn-primary:active {
    transform: scale(0.98);
  }

  /* Lien secondaire — outline arrondi */
  .secondary-link {
    display: block;
    text-align: center;
    margin-top: 16px;
    font-size: 13px;
    color: #B3B3B3;
    text-decoration: none;
    font-weight: 500;
    padding: 12px;
    border-radius: 100px;
    border: 1px solid #282828;
    transition: all 200ms;
  }
  .secondary-link:hover {
    border-color: #FF6B00;
    color: #FF6B00;
  }

  /* Badge offline — sobre, gris */
  .offline-badge {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 8px 16px;
    margin-top: 24px;
    border-radius: 8px;
    background: #181818;
    border: 1px solid #282828;
    font-size: 12px;
    color: #808080;
    font-weight: 500;
  }
  .offline-dot {
    width: 6px; height: 6px;
    background: #1DB954;
    border-radius: 50%;
  }
</style>
</head>
<body>

<div class="login-card">
  <div class="logo">
    <div class="logo-circle">L</div>
    <h1>Lumina</h1>
    <p>Plateforme Organisationnelle</p>
  </div>

  <form onsubmit="event.preventDefault()">
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="vous@mfejc.org">
    </div>
    <div class="form-group">
      <label for="password">Mot de passe</label>
      <input type="password" id="password" placeholder="••••••••">
    </div>
    <button type="submit" class="btn-primary">Se connecter</button>
  </form>

  <a href="#" class="secondary-link">Demander un accès administrateur</a>

  <div class="offline-badge">
    <span class="offline-dot"></span>
    Fonctionne hors-ligne
  </div>
</div>

</body>
</html>
