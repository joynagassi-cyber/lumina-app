name: Deploy

on:
  workflow_run:
    workflows: ["Lumina CI - Strict Implementation Gate"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Railway / Supabase
        run: echo "Backend deployment placeholder — configure Railway CLI or Supabase migrations here"

  deploy-frontend:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' }}
    needs: deploy-backend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Build and submit EAS
        run: |
          echo "EAS build placeholder — configure eas.json and Expo credentials before merging"
