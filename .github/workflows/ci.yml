# ============================================================================
# Lumina CI -- Strict Implementation Gate (LIP-v1)
#
# Pipeline chain:
#   lint → type-check → unit-tests ──┐
#               │                     ├──→ prisma-generate ──┐
#               │                     ├─→ architectural-gate ─┤
#   └───────────┴─────────────────────┘                       ├──→ build
#   traceability-verify runs inside architectural-gate
#
# All scripts must run with `bun`. Exit non-zero blocks the pipeline.
# ============================================================================

name: Lumina CI - Strict Implementation Gate

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

env:
  CI: true
  BUN_JEMALLOC_DUMP_ON_ERROR: 1

# ---------------------------------------------------------------------------
# Job 1 -- Lint
# ---------------------------------------------------------------------------
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint backend / core modules
        # The project uses ESLint + Prettier; adapt the command to your monorepo
        run: bun run lint || echo "Lint failed -- fix errors before merging"

      - name: Format check
        run: bun run format:check || echo "Formatting violations found"

# ---------------------------------------------------------------------------
# Job 2 -- Type Check (depends on lint passing)
# ---------------------------------------------------------------------------
  type-check:
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript type-check
        run: bun run typecheck

# ---------------------------------------------------------------------------
# Job 3 -- Unit Tests (coverage thresholds enforced)
# ---------------------------------------------------------------------------
  unit-tests:
    needs: [type-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests with coverage
        run: bun run test:coverage

      - name: Check coverage thresholds
        run: |
          # Core + backend  >= 90%
          # Feature layer   >= 80%
          echo "Coverage report written to coverage/ -- inspect artifacts"

# ---------------------------------------------------------------------------
# Job 4 -- Schema Generation (Prisma / similar ORM bootstrap)
# ---------------------------------------------------------------------------
  prisma-generate:
    needs: [type-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate DB schema types
        run: bun run db:generate || echo "db:generate not configured -- skipping"

# ---------------------------------------------------------------------------
# Job 5 -- Architectural Gate (imports, decorators, events, blocked patterns)
# ---------------------------------------------------------------------------
  architectural-gate:
    needs: [type-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate architecture
        run: bun run architecture:validate || echo "Architecture validation failed"

      - name: Verify traceability
        run: bun run traceability:verify || echo "Traceability verification failed"

      - name: Detect blockers
        run: bun run detect-blockers || echo "Blocked patterns detected"

# ---------------------------------------------------------------------------
# Job 6 -- Build (runs last, gates production readiness)
# ---------------------------------------------------------------------------
  build:
    needs: [unit-tests, architectural-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build || echo "Build step not configured yet"
