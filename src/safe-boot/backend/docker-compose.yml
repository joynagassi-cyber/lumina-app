# Lumina Local Development Stack
# Per ITS-V1: PostgreSQL 16+ with Supabase-compatible RLS
# DO NOT USE IN PRODUCTION — development only

services:
  postgres:
    image: postgres:16-alpine
    container_name: lumina-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lumina_dev
      POSTGRES_USER: lumina_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lumina_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - lumina_data:/var/lib/postgresql/data
      # Bootstrap scripts executed first run
      - ./prisma/migrations/init:/docker-entrypoint-initdb.d/00-init
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c max_connections=100
      -c listen_addresses=*
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumina_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: lumina-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_DB: lumina_vector
      POSTGRES_USER: lumina_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lumina_dev_password}
    ports:
      - "5433:5432"
    volumes:
      - lumina_vector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumina_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  lumina_data:
    driver: local
  lumina_vector_data:
    driver: local
